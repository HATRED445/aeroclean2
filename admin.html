<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrator · AeroClean</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="topbar-start" id="topbar-menu"></div>
    <div class="brand is-left">
      <div class="brand-mark">A</div>
      <div class="brand-name">Aero<span>Clean</span></div>
    </div>
  </header>

  <main class="main">
    <div class="menu-root" id="app-menu"></div>
    <div class="row-between" style="margin-bottom:18px">
      <div>
        <h1 class="card-title">Administration</h1>
        <p class="muted">Signed in as <strong id="admin-name">—</strong></p>
      </div>
      <button type="button" class="btn btn-light btn-sm" id="refresh-btn">Refresh</button>
    </div>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">Total accounts</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Pending approval</div>
        <div class="stat-value" id="stat-pending">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Personnel</div>
        <div class="stat-value" id="stat-personnel">0</div>
      </div>
    </section>

    <section id="accounts-section">
      <div class="section-head">
        <h2 class="section-title">All accounts</h2>
        <div class="filters">
          <div class="search-group">
            <input type="search" id="filter-search" placeholder="Search name, ID, email..." aria-label="Search accounts">
            <button type="button" id="filter-search-btn" class="btn btn-primary btn-sm">Search</button>
          </div>
          
          <select id="filter-status" aria-label="Filter by status">
            <option value="all">All statuses</option>
            <option value="active" selected>Active</option>
            <option value="pending">Pending</option>
            <option value="declined">Declined</option>
          </select>
        </div>
      </div>

      <div class="row" style="margin-bottom: 18px; gap: 12px;">
        <a href="admin-pending.html" class="btn btn-primary" style="flex: 1;">
          <span>Approvals</span>
          <span aria-hidden="true">&rsaquo;</span>
        </a>
        <a href="admin-deactivated.html" class="btn btn-ghost" style="flex: 1;">
          <span>Deactivated Accounts</span>
          <span aria-hidden="true">&rsaquo;</span>
        </a>
      </div>

      <div class="table-wrap" id="accounts-wrap">
        <table>
<thead>
              <tr>
                <th>Name</th>
                <th>School ID</th>
                <th>Status</th>
                <th>Registered</th>
                <th style="text-align:right">Action</th>
              </tr>
            </thead>
          <tbody id="accounts-body"></tbody>
        </table>
      </div>
      <p class="empty" id="accounts-empty" hidden>No accounts match this filter.</p>
    </section>
  </main>
</div>

<div id="toast-root"></div>

<script src="js/core.js"></script>
<script src="js/telemetry.js"></script>
<script src="js/menu.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
