<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedules · AeroClean</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body data-allowed="admin personnel">
<div class="shell">
  <header class="topbar">
    <div class="topbar-start" id="topbar-menu"></div>
    <div class="brand is-left">
      <div class="brand-mark">A</div>
      <div class="brand-name">Aero<span>Clean</span></div>
    </div>
  </header>

  <main class="main">
    <div class="menu-root" id="app-menu"></div>

    <div class="row-between" style="margin-bottom:18px; flex-wrap:wrap; gap:12px; align-items:center">
      <div>
        <h1 class="card-title">Schedules</h1>
        <p class="muted">Room cleaning schedules</p>
      </div>
      <div id="admin-actions" hidden>
        <button type="button" class="btn btn-primary" id="create-schedule-btn">Create Schedule</button>
      </div>
    </div>

    <section class="card" style="margin-bottom:18px">
      <div class="filters" style="gap:12px; flex-wrap:wrap; align-items:flex-end">
        <div class="search-group" style="min-width:200px; flex:1">
          <input type="search" id="filter-search" placeholder="Search title, room..." aria-label="Search schedules">
        </div>
        <select id="filter-room" aria-label="Filter by room" style="min-width:160px">
          <option value="all">All Rooms</option>
        </select>
        <select id="filter-recurrence" aria-label="Filter by recurrence" style="min-width:140px">
          <option value="all">All Types</option>
          <option value="none">One-time</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
        </select>
        <div class="row" id="date-range-controls" style="gap:8px; flex-wrap:wrap">
          <label style="font-size:12px; color:var(--on-dark-soft); white-space:nowrap">From</label>
          <input type="date" id="filter-date-from" style="width:160px; padding:8px 10px; border-radius:8px; border:1px solid var(--glass-line); background:var(--field); color:var(--ink); font:inherit">
          <label style="font-size:12px; color:var(--on-dark-soft); white-space:nowrap">To</label>
          <input type="date" id="filter-date-to" style="width:160px; padding:8px 10px; border-radius:8px; border:1px solid var(--glass-line); background:var(--field); color:var(--ink); font:inherit">
        </div>
        <div class="row" id="quick-filters" style="gap:8px">
          <button type="button" class="btn btn-sm" data-preset="week">Next 7 Days</button>
          <button type="button" class="btn btn-sm btn-primary" data-preset="month">Next 30 Days</button>
          <button type="button" class="btn btn-sm" data-preset="all">All</button>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="print-btn">Print</button>
      </div>
    </section>

    <section class="card" style="margin-bottom:18px">
      <div class="table-wrap" id="schedules-wrap">
        <table>
          <thead>
            <tr>
              <th>Room</th>
              <th>Date</th>
              <th>Time</th>
              <th>Title</th>
              <th>Recurrence</th>
              <th>Status</th>
              <th id="personnel-th" hidden>Personnel</th>
              <th id="actions-th" hidden>Actions</th>
            </tr>
          </thead>
          <tbody id="schedules-body"></tbody>
        </table>
      </div>
      <p class="empty" id="schedules-empty" hidden>No schedules found.</p>
      <div class="pagination" id="pagination" style="display:flex; justify-content:center; gap:6px; margin-top:16px; flex-wrap:wrap"></div>
    </section>
  </main>
</div>

<div id="toast-root"></div>

<div class="modal-backdrop" id="schedule-modal-backdrop" hidden></div>
<div class="modal" id="schedule-modal" role="dialog" aria-modal="true" aria-labelledby="schedule-modal-title" hidden>
  <div class="modal-header">
    <h2 class="modal-title" id="schedule-modal-title">Create Schedule</h2>
    <button class="modal-close" id="schedule-modal-close" aria-label="Close modal">&times;</button>
  </div>
  <div class="modal-content">
    <form id="schedule-form">
      <div class="field">
        <label for="schedule-room">Room <span style="color:var(--bad)">*</span></label>
        <select id="schedule-room" required>
          <option value="">Select a room</option>
        </select>
      </div>
      <div class="field" id="schedule-personnel-field" hidden>
        <label for="schedule-personnel">Assigned Personnel <span class="muted">(optional)</span></label>
        <select id="schedule-personnel">
          <option value="">Unassigned</option>
        </select>
      </div>
      <div class="field">
        <label for="schedule-date">Date <span style="color:var(--bad)">*</span></label>
        <input type="date" id="schedule-date" required>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="schedule-start">Start Time <span style="color:var(--bad)">*</span></label>
          <input type="time" id="schedule-start" required>
        </div>
        <div class="field">
          <label for="schedule-end">End Time <span style="color:var(--bad)">*</span></label>
          <input type="time" id="schedule-end" required>
        </div>
      </div>
      <div class="field">
        <label for="schedule-title">Title <span style="color:var(--bad)">*</span></label>
        <input type="text" id="schedule-title" required maxlength="100" placeholder="e.g., Daily Cleaning">
      </div>
      <div class="field">
        <label for="schedule-desc">Description</label>
        <textarea id="schedule-desc" maxlength="500" placeholder="Optional details..."></textarea>
        <div class="char-count" id="desc-char-count">0/500 characters</div>
      </div>
      <div class="field">
        <label>Recurrence</label>
        <div class="row" style="gap:16px; flex-wrap:wrap" role="radiogroup" aria-label="Recurrence">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex:1; min-width:100px">
            <input type="radio" name="recurrence" value="none" checked style="width:18px; height:18px; accent-color:var(--c-start)">
            <span>One-time</span>
          </label>
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex:1; min-width:100px">
            <input type="radio" name="recurrence" value="daily" style="width:18px; height:18px; accent-color:var(--c-start)">
            <span>Daily</span>
          </label>
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex:1; min-width:100px">
            <input type="radio" name="recurrence" value="weekly" style="width:18px; height:18px; accent-color:var(--c-start)">
            <span>Weekly</span>
          </label>
        </div>
      </div>
      <div class="field" id="recurrence-end-field" hidden>
        <label for="schedule-recurrence-end">Recurrence End Date</label>
        <input type="date" id="schedule-recurrence-end">
      </div>
      <div id="conflict-warning" class="alert alert-error" hidden></div>
      <div class="row" style="justify-content:flex-end; margin-top:8px; gap:10px">
        <button type="button" class="btn btn-ghost" id="schedule-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/telemetry.js"></script>
<script src="js/menu.js"></script>
<script src="js/schedule.js"></script>
</body>
</html>
