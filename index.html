<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · AeroClean</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<main class="auth-shell">
  <div class="auth-col">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-name">Aero<span>Clean</span></div>
    </div>
    <p class="brand-sub">School portal for students, personnel and administrators</p>

    <section class="card">
      <h1 class="card-title">Welcome back</h1>
      <p class="card-sub">Sign in with your School ID and password.</p>

      <form id="login-form" class="stack" novalidate>
        <div class="field">
          <label for="schoolId">School ID</label>
          <input id="schoolId" name="schoolId" type="text" autocomplete="username"
                 placeholder="e.g. ADMIN001" spellcheck="false">
          <p class="field-error" data-error-for="schoolId"></p>
        </div>

        <div class="field password-field">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input id="password" name="password" type="password" autocomplete="current-password"
                   placeholder="Your password">
            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
              <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <p class="field-error" data-error-for="password"></p>
        </div>

        <div id="login-alert" class="alert" hidden></div>

        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        <button type="button" id="guest-login-btn" class="btn btn-ghost btn-block" style="margin-top: 12px;">Sign In as Guest</button>
      </form>

      <p class="card-foot">Don't have an account? <a href="register.html">Register</a></p>
    </section>

    <p class="hint" style="margin-top:14px">
      Demo administrator: <span class="code">ADMIN001</span> / <span class="code">admin123</span>
    </p>
  </div>
</main>

<div id="toast-root"></div>

<script src="js/core.js"></script>
<script src="js/login.js"></script>
</body>
</html>
