<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Reports · AeroClean</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body data-allowed="personnel">
<div class="shell">
  <header class="topbar">
    <div class="topbar-start" id="topbar-menu"></div>
    <div class="brand is-left">
      <div class="brand-mark">A</div>
      <div class="brand-name">Aero<span>Clean</span></div>
    </div>
  </header>

  <main class="main">
    <div class="menu-root" id="app-menu"></div>

    <div class="row-between" style="margin-bottom:18px; flex-wrap:wrap; gap:12px; align-items:center">
      <div>
        <h1 class="card-title">My Reports</h1>
        <p class="muted">Reports you have submitted</p>
      </div>
    </div>

    <section class="stats" style="margin-bottom:18px">
      <div class="stat">
        <div class="stat-label">Total Submitted</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">This Month</div>
        <div class="stat-value" id="stat-month">0</div>
      </div>
    </section>

    <div class="filters" style="margin-bottom:18px; gap:10px">
      <div class="search-group" style="flex:1; min-width:200px">
        <input type="search" id="report-search" placeholder="Search device, room, note…" aria-label="Search reports">
      </div>
      <select id="filter-type" aria-label="Filter by type" style="min-width:180px">
        <option value="">All Types</option>
        <option value="alert_fixed">Alert Fixed</option>
        <option value="maintenance_complete">Maintenance Complete</option>
        <option value="broken_device">Broken Device</option>
      </select>
      <div id="custom-date-range" class="row" style="gap:8px; align-items:center; flex-wrap:wrap">
        <label for="filter-date-from" style="font-size:12px; color:var(--on-dark-soft); white-space:nowrap">From</label>
        <input type="date" id="filter-date-from" style="flex:1; min-width:140px; padding:9px 12px; border-radius:999px; border:none; background:var(--field); color:var(--ink); font:inherit; font-size:13.5px; font-weight:600">
        <label for="filter-date-to" style="font-size:12px; color:var(--on-dark-soft); white-space:nowrap">To</label>
        <input type="date" id="filter-date-to" style="flex:1; min-width:140px; padding:9px 12px; border-radius:999px; border:none; background:var(--field); color:var(--ink); font:inherit; font-size:13.5px; font-weight:600">
        <button type="button" class="btn btn-ghost btn-sm" id="clear-date-filter" style="padding:7px 13px; font-size:13px; border-radius:10px; height:38px">Clear</button>
      </div>
    </div>

    <section class="card" style="margin-bottom:18px">
      <div class="table-wrap" id="reports-wrap">
        <table class="reports-table">
          <thead>
            <tr>
              <th>Device</th>
              <th>Type</th>
              <th>Date</th>
              <th>Time</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody id="reports-body"></tbody>
        </table>
      </div>
      <p class="empty" id="reports-empty" hidden>No reports submitted yet. Open a device on the dashboard and use "Create Report" inside the device details.</p>

      <div class="pagination" id="pagination" style="display:flex; justify-content:center; gap:6px; margin-top:16px; flex-wrap:wrap"></div>
    </section>
  </main>
</div>

<div id="toast-root"></div>

<div class="modal-backdrop" id="report-modal-backdrop" hidden></div>
<div class="modal report-detail-modal" id="report-detail-modal" role="dialog" aria-modal="true" aria-labelledby="report-detail-title" hidden>
  <div class="modal-header">
    <h2 class="modal-title" id="report-detail-title">Report Details</h2>
    <button class="modal-close" id="report-detail-close" aria-label="Close modal">&times;</button>
  </div>
  <div class="modal-content">
    <div class="report-detail-field">
      <span class="report-detail-label">Device:</span>
      <span class="report-detail-value" id="detail-device"></span>
    </div>
    <div class="report-detail-field">
      <span class="report-detail-label">Type:</span>
      <span class="report-detail-value" id="detail-type"></span>
    </div>
    <div class="report-detail-field">
      <span class="report-detail-label">Status:</span>
      <span class="report-detail-value" id="detail-status"></span>
    </div>
    <div class="report-detail-field">
      <span class="report-detail-label">Date:</span>
      <span class="report-detail-value" id="detail-date"></span>
    </div>
    <div class="report-detail-field">
      <span class="report-detail-label">Time:</span>
      <span class="report-detail-value" id="detail-time"></span>
    </div>
    <div class="report-detail-field" style="margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.18)">
      <span class="report-detail-label" style="margin-top:0">Note:</span>
      <div class="report-detail-note" id="detail-note"></div>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/telemetry.js"></script>
<script src="js/menu.js"></script>
<script src="js/reports-personnel.js"></script>
</body>
</html>
