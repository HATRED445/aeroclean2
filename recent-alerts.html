<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recent Alerts · AeroClean</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body data-allowed="personnel,admin">
<div class="shell">
  <header class="topbar">
    <div class="topbar-start" id="topbar-menu"></div>
    <div class="brand is-left">
      <div class="brand-mark">A</div>
      <div class="brand-name">Aero<span>Clean</span></div>
    </div>
  </header>

  <main class="main">
    <div class="menu-root" id="app-menu"></div>

    <div class="row-between" style="margin-bottom:18px; flex-wrap:wrap; gap:12px; align-items:center">
      <div>
        <h1 class="card-title">Recent Alerts</h1>
        <p class="muted">Odor Alert events (gradual, &ge;8s duration, last 24h)</p>
      </div>
      <span class="badge badge-active" id="live-count">0 alerts</span>
    </div>

    <div class="filters" style="margin-bottom:18px; gap:10px; flex-wrap:wrap">
      <div class="search-group" style="flex:1; min-width:200px">
        <input type="search" id="alert-search" placeholder="Search room, node ID&hellip;" aria-label="Search alerts">
      </div>

      <select id="filter-event-type" aria-label="Filter by event type" style="min-width:180px">
        <option value="">All Types</option>
        <option value="gradual">Gradual</option>
        <option value="spike">Sudden</option>
      </select>

      <div id="alert-date-range" class="row" style="gap:8px; align-items:center; flex-wrap:wrap">
        <label for="filter-alert-date-from" style="font-size:12px; color:var(--on-dark-soft); white-space:nowrap">From</label>
        <input type="date" id="filter-alert-date-from" style="flex:1; min-width:140px; padding:9px 12px; border-radius:999px; border:none; background:var(--field); color:var(--ink); font:inherit; font-size:13.5px; font-weight:600">
        <label for="filter-alert-date-to" style="font-size:12px; color:var(--on-dark-soft); white-space:nowrap">To</label>
        <input type="date" id="filter-alert-date-to" style="flex:1; min-width:140px; padding:9px 12px; border-radius:999px; border:none; background:var(--field); color:var(--ink); font:inherit; font-size:13.5px; font-weight:600">
        <button type="button" class="btn btn-ghost btn-sm" id="clear-alert-date-filter" style="padding:7px 13px; font-size:13px; border-radius:10px; height:38px">Clear</button>
      </div>

      <div class="row" style="gap:8px; align-items:center; flex-wrap:wrap">
        <label for="filter-min-duration" style="font-size:12px; color:var(--on-dark-soft); white-space:nowrap">Min Duration (s)</label>
        <input type="number" id="filter-min-duration" min="8" max="3600" step="1" placeholder="8" style="width:80px; padding:9px 12px; border-radius:999px; border:none; background:var(--field); color:var(--ink); font:inherit; font-size:13.5px; font-weight:600">
        <label for="filter-max-duration" style="font-size:12px; color:var(--on-dark-soft); white-space:nowrap">Max Duration (s)</label>
        <input type="number" id="filter-max-duration" min="8" max="3600" step="1" placeholder="3600" style="width:80px; padding:9px 12px; border-radius:999px; border:none; background:var(--field); color:var(--ink); font:inherit; font-size:13.5px; font-weight:600">
      </div>
    </div>

    <section class="card">
      <div class="table-wrap" id="alerts-wrap">
        <table class="reports-table">
          <thead>
            <tr>
              <th>Room</th>
              <th>Node ID</th>
              <th>Start Time</th>
              <th>Duration</th>
              <th>Peak PPM</th>
              <th>Event Type</th>
            </tr>
          </thead>
          <tbody id="alerts-body"></tbody>
        </table>
      </div>
      <p class="empty" id="alerts-empty" hidden>No qualifying alerts in the last 24 hours.</p>
    </section>
  </main>
</div>

<div id="toast-root"></div>

<script src="js/core.js"></script>
<script src="js/telemetry.js"></script>
<script src="js/menu.js"></script>
<script src="js/recent-alerts.js"></script>
</body>
</html>
